[versions]
minecraft       = "26.1.1"
fabric-loader   = "0.18.5"
fabric-api      = "0.144.3+26.1"
fabric-kotlin   = "1.13.10+kotlin.2.3.20"
arcade          = "0.9.0-beta.23+26.1.1"
polymer         = "0.16.1+26.1.1"

# Plugins
loom = "1.15-SNAPSHOT"

[libraries]
minecraft       = { module = "com.mojang:minecraft"                        , version.ref = "minecraft" }
fabric-loader   = { module = "net.fabricmc:fabric-loader"                  , version.ref = "fabric-loader" }
fabric-api      = { module = "net.fabricmc.fabric-api:fabric-api"          , version.ref = "fabric-api" }
fabric-kotlin   = { module = "net.fabricmc:fabric-language-kotlin"         , version.ref = "fabric-kotlin" }
arcade          = { module = "net.casualchampionships:arcade"              , version.ref = "arcade" }
polymer         = { module = "eu.pb4:polymer-core"                         , version.ref = "polymer" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }